<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC Капус</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
  --accent:#2f5bea; --a:#1f9d55; --b:#d79a00; --c:#e2572b; --d:#8a8f98;
  --pos:#1f9d55; --neg:#c93a2b; --chip:#eef1f6; --input:#fff; --hl:#fff7e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --muted:#98a2b3; --line:#2b313a;
    --accent:#7896ff; --a:#3ecf7f; --b:#f0b429; --c:#ff7a50; --d:#8a8f98;
    --pos:#3ecf7f; --neg:#ff6b5b; --chip:#242a33; --input:#12161b; --hl:#2c2814;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --muted:#98a2b3; --line:#2b313a;
  --accent:#7896ff; --a:#3ecf7f; --b:#f0b429; --c:#ff7a50; --d:#8a8f98;
  --pos:#3ecf7f; --neg:#ff6b5b; --chip:#242a33; --input:#12161b; --hl:#2c2814;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:20px 16px 8px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.abcbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.filters input,.filters select{background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px}
.filters input[type=search]{flex:1;min-width:180px}
.filters label{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
.btn{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th.sorted{color:var(--accent)}
td.l,th.l{text-align:left}
td.name{text-align:left;white-space:normal;min-width:260px;max-width:380px}
td.name small{color:var(--muted);display:block}
.badge{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;color:#fff;font-size:12px}
.bA{background:var(--a)}.bB{background:var(--b)}.bC{background:var(--c)}.bD{background:var(--d)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
td input{width:70px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;text-align:right}
td input.cl{width:170px;text-align:left}
tr.filled td{background:var(--hl)}
.buyers{white-space:normal;min-width:220px;max-width:300px;text-align:left;font-size:12px}
.buyers span{display:inline-block;background:var(--chip);border-radius:5px;padding:1px 6px;margin:1px 2px 1px 0}
.spark{display:inline-flex;gap:1px;align-items:flex-end;height:18px}
.spark i{display:block;width:4px;background:var(--accent);opacity:.75;border-radius:1px}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
@media (max-width:640px){h1{font-size:18px}.kpi .v{font-size:17px}}
</style>
</head>

<header>

<main>

    <button class="btn" id="clear" title="Очистить введённые скидки и клиентов">Сбросить ввод</button>
    <span class="count" id="cnt"></span>
  </div>

  <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="foot" id="foot"></div>
</main>

const M = DATA.meta, ITEMS = DATA.items;
const fmt = n => n==null||n===''?'—':Math.round(n).toLocaleString('ru-RU');
const fmt1 = n => n==null?'—':(+n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MS = ['фев','мар','апр','май','июн','июл','авг','сен','окт'];

// ручной ввод — хранится в браузере
let INP = {};
try{ INP = JSON.parse(localStorage.getItem('kapous_sale_input')||'{}') }catch(e){ INP = {} }
const save = () => { try{ localStorage.setItem('kapous_sale_input', JSON.stringify(INP)) }catch(e){} };
const inp = a => INP[a] || (INP[a] = {});
const salePrice = it => { const d = parseFloat((INP[it.art]||{}).disc); return (it.price && !isNaN(d)) ? it.price*(1-d/100) : null; };

document.getElementById('sub').textContent =
  `Продажи из CRM: ${M.period} · остатки на ${M.stockDate} · прайс с ${M.priceDate}`;

// KPI
(function(){
  const by = {A:[0,0,0,0],B:[0,0,0,0],C:[0,0,0,0],D:[0,0,0,0]};
  ITEMS.forEach(i=>{ const b=by[i.abc]; b[0]++; b[1]+=i.rev; b[2]+=i.stock; b[3]+=i.stockVal||0; });
  const tot = M.totalRev, stv = Object.values(by).reduce((s,b)=>s+b[3],0);
  const k = (l,v,s)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;
  const bar = `<div class="abcbar">${['A','B','C'].map(x=>`<div style="width:${by[x][1]/tot*100}%;background:var(--${x.toLowerCase()})"></div>`).join('')}</div>`;
  document.getElementById('kpis').innerHTML =
    k('Выручка Капус+Студио', fmt(tot)+' сом', `${by.A[0]+by.B[0]+by.C[0]} позиций с продажами`+bar) +
    k('<span class="badge bA">A</span> 80% выручки', by.A[0]+' поз.', `остаток ${fmt(by.A[2])} шт · ${fmt(by.A[3])} сом`) +
    k('<span class="badge bB">B</span> 15% выручки', by.B[0]+' поз.', `остаток ${fmt(by.B[2])} шт · ${fmt(by.B[3])} сом`) +
    k('<span class="badge bC">C</span> 5% выручки', by.C[0]+' поз.', `остаток ${fmt(by.C[2])} шт · ${fmt(by.C[3])} сом`) +
    k('<span class="badge bD">—</span> Без продаж, но на остатке', ITEMS.filter(i=>i.abc==='D'&&i.stock>0).length+' поз.', `остаток ${fmt(by.D[2])} шт · ${fmt(by.D[3])} сом`) +
    k('C + без продаж в остатках', fmt(by.C[3]+by.D[3])+' сом', `${Math.round((by.C[3]+by.D[3])/stv*100)}% стоимости остатков по прайсу`);
})();

  realNew:{h:'Факт сен–окт',v:i=>i.realNew,r:i=>fmt1(i.realNew)},
  realAll:{h:'Факт фев–окт',v:i=>i.realAll,r:i=>fmt1(i.realAll)},
  disc:{h:'Скидка факт %',v:i=>i.disc??-99,r:i=>i.disc==null?'—':`<span class="${i.disc>=15?'neg':i.disc<0?'pos':''}">${fmt1(i.disc)}</span>`},
  stockVal:{h:'Остаток, сом',v:i=>i.stockVal||0,r:i=>fmt(i.stockVal)},
  myDisc:{h:'Скидка распр. %',v:i=>parseFloat((INP[i.art]||{}).disc)||-1,raw:1,r:i=>`<td><input type="number" min="0" max="90" step="1" data-a="${esc(i.art)}" data-f="disc" value="${esc((INP[i.art]||{}).disc??'')}" placeholder="%"></td>`},
  salePrice:{h:'Цена распр.',v:i=>salePrice(i)||0,r:i=>{const p=salePrice(i);return p==null?'—':`<b>${fmt(p)}</b>`},cls:'sp'},
  saleSum:{h:'Сумма распр.',v:i=>(salePrice(i)||0)*i.stock,r:i=>{const p=salePrice(i);return p==null?'—':fmt(p*i.stock)},cls:'ss'},
  myClient:{h:'Клиент (кому продать)',v:i=>(INP[i.art]||{}).client||'',l:1,raw:1,r:i=>`<td class="l"><input class="cl" list="dl-${esc(i.art)}" data-a="${esc(i.art)}" data-f="client" value="${esc((INP[i.art]||{}).client??'')}" placeholder="выбрать / вписать"><datalist id="dl-${esc(i.art)}">${i.buyers.map(b=>`<option value="${esc(b[0])}">`).join('')}</datalist></td>`},
  buyers:{h:'Кто покупал (шт · посл. мес.)',l:1,v:i=>i.buyers.length,raw:1,r:i=>`<td class="buyers">${i.buyers.length?`<span title="${esc(i.buyers.map(b=>b[0]+' — '+b[1]+' шт, посл. '+b[2]).join('\n'))}">`+i.buyers.slice(0,4).map(b=>`${esc(b[0])} · ${fmt(b[1])} · ${b[2].slice(0,3)}`).join('</span><span>')+'</span>'+(i.buyers.length>4?`<span class="mut">+${i.buyers.length-4}</span>`:''):'<span class="mut">не покупали</span>'}</td>`},
};
const VIEWS = {
  sale:{cols:['abc','name','stock','stSklad','stShops','stBrak','stockVal','q3','cover','price','realNew','myDisc','salePrice','saleSum','myClient','buyers'],
        abc:'CD',stock:true,sort:['stockVal',-1],
        hint:'Кандидаты на распродажу: класс C и товары без продаж, у которых есть остаток. Впишите скидку и клиента — цена и сумма пересчитаются, ввод сохраняется в этом браузере. «Кто покупал» — клиенты из CRM, которые уже брали этот товар: им проще всего предложить.'},
  abc:{cols:['abc','name','rev','share','cum','qty','clients','months','spark','stock','stSklad','stShops','cover','price','realNew','disc','myDisc','myClient'],
        abc:'',stock:false,sort:['rev',-1],
        hint:'ABC по выручке за весь период CRM: A — первые 80% выручки, B — следующие 15%, C — последние 5%. «Без продаж» — товар есть в остатках или прайсе, но в CRM продаж нет. «Запас, мес» = остаток / среднемесячные продажи за авг–окт.'},
  price:{cols:['abc','name','qty','price','realNew','disc','realAll','rev','stock','myDisc','myClient'],
        abc:'',stock:false,sort:['disc',-1],onlyPrice:true,
        hint:'Сравнение цены прайса (с 01.09) и фактической цены реализации = выручка / количество (сен–23 окт, без нулевых строк — тестеров). «Скидка факт %» — насколько в среднем продавали ниже прайса. Красным — скидка 15% и больше.'},
  plan:{cols:['abc','name','stock','price','myDisc','salePrice','saleSum','myClient','buyers'],
        abc:'',stock:false,sort:['saleSum',-1],onlyFilled:true,
        hint:'Только позиции, где вы вписали скидку или клиента. Отсюда удобно скачать CSV и отправить агентам.'},
};
let view='sale', sort=VIEWS.sale.sort.slice();

function rows(){
  const v=VIEWS[view], q=document.getElementById('q').value.trim().toLowerCase();
  const fa=document.getElementById('fAbc').value, fl=document.getElementById('fLine').value,
        fs=document.getElementById('fSec').value, st=document.getElementById('fStock').checked;
  let r=ITEMS.filter(i=>{
    if(fa==='CD'){ if(!(i.abc==='C'||i.abc==='D')) return false } else if(fa && i.abc!==fa) return false;
    if(fl && i.line!==fl) return false;
    if(fs && i.section!==fs) return false;
    if(st && !(i.stock>0)) return false;
    if(v.onlyPrice && i.disc==null) return false;
    if(v.onlyFilled){ const x=INP[i.art]; if(!x||!(x.disc||x.client)) return false }
    if(q){ const x=INP[i.art]||{}; const h=(i.name+' '+i.art+' '+i.section+' '+i.buyers.map(b=>b[0]).join(' ')+' '+(x.client||'')).toLowerCase(); if(!h.includes(q)) return false }
    return true;
  });
  const c=C[sort[0]];
  r.sort((a,b)=>{const x=c.v(a),y=c.v(b); return (typeof x==='string'? x.localeCompare(y,'ru') : (x??-1e9)-(y??-1e9))*sort[1]});
  return r;
}
function render(){
  const v=VIEWS[view], r=rows();
  document.getElementById('hint').textContent=v.hint;
  document.querySelector('#tbl thead').innerHTML='<tr>'+v.cols.map(k=>`<th data-k="${k}" class="${C[k].l?'l ':''}${sort[0]===k?'sorted':''}">${C[k].h}${sort[0]===k?(sort[1]<0?' ↓':' ↑'):''}</th>`).join('')+'</tr>';
  const lim=r.slice(0,1500);
  document.querySelector('#tbl tbody').innerHTML=lim.map(i=>{
    const x=INP[i.art]; const f=x&&(x.disc||x.client);
    return `<tr data-a="${esc(i.art)}" class="${f?'filled':''}">`+v.cols.map(k=>C[k].raw?C[k].r(i):`<td class="${C[k].l?'l ':''}${C[k].cls||''}">${C[k].r(i)}</td>`).join('')+'</tr>'
  }).join('');
  const sv=r.reduce((s,i)=>s+(i.stockVal||0),0), ss=r.reduce((s,i)=>s+(salePrice(i)||0)*i.stock,0);
  document.getElementById('cnt').textContent=`${r.length} поз. · остаток по прайсу ${fmt(sv)} сом`+(ss?` · по ценам распродажи ${fmt(ss)} сом`:'');
}
document.getElementById('tabs').onclick=e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  view=b.dataset.t; const v=VIEWS[view]; sort=v.sort.slice();
  document.getElementById('fAbc').value=v.abc; document.getElementById('fStock').checked=v.stock;
  render();
};
document.querySelector('#tbl thead').onclick=e=>{
  const th=e.target.closest('th'); if(!th) return; const k=th.dataset.k;
  sort = sort[0]===k ? [k,-sort[1]] : [k, C[k].l?1:-1]; render();
};
document.querySelector('#tbl tbody').addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.f) return;
  const a=el.dataset.a; inp(a)[el.dataset.f]=el.value; save();
  const it=ITEMS.find(i=>i.art===a), tr=el.closest('tr');
  const p=salePrice(it);
  const sp=tr.querySelector('.sp'), ss=tr.querySelector('.ss');
  if(sp) sp.innerHTML=p==null?'—':`<b>${fmt(p)}</b>`;
  if(ss) ss.innerHTML=p==null?'—':fmt(p*it.stock);
  const x=INP[a]; tr.classList.toggle('filled',!!(x.disc||x.client));
});
['q','fAbc','fLine','fSec','fStock'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('clear').onclick=()=>{ if(confirm('Очистить все введённые скидки и клиентов?')){INP={};save();render()} };
document.getElementById('csv').onclick=()=>{
  const r=rows();
  const H=['ABC','Артикул','Товар','Линия','Раздел','Выручка','Продано шт','Продано авг-окт','Остаток всего','Осн. склад','Магазины','Обучалка','Брак','Запас мес','Прайс','Факт сен-окт','Скидка факт %','Остаток по прайсу','Скидка распр. %','Цена распр.','Сумма распр.','Клиент','Кто покупал'];
  const L=r.map(i=>{const x=INP[i.art]||{},p=salePrice(i);return [i.abc==='D'?'без продаж':i.abc,i.art,i.name,i.line,i.section,i.rev,i.qty,i.q3,i.stock,i.stSklad,i.stShops,i.stOther,i.stBrak,i.cover??'',i.price??'',i.realNew??'',i.disc??'',i.stockVal??'',x.disc??'',p?Math.round(p):'',p?Math.round(p*i.stock):'',x.client??'',i.buyers.map(b=>b[0]+' ('+b[1]+')').join('; ')]});
  const csv='﻿'+[H,...L].map(row=>row.map(c=>{c=String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`kapous_${view}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
};
document.getElementById('foot').innerHTML=
  `Источник продаж — CRM (история фев–сен + срезы агентов за октябрь), бренды Kapous и Studio. Остаток «всего» = основной склад + магазины + обучалка, без склада брака. Стоимость остатков — по прайсу.`+
  (M.unmatched.length?` Не сопоставлено с прайсом: ${M.unmatched.map(esc).join(', ')}.`:'')+
  ` Введённые скидки и клиенты хранятся только в этом браузере — чтобы передать, скачайте CSV.`;
document.querySelector('.tab.on').click();
</script>
</body>
</html>
